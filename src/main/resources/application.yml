spring:
  application:
    name: poketra-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}